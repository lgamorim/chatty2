name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# CI only ever reads the repo.
permissions:
  contents: read

# A new push to a branch supersedes the run already in flight for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both legs; don't hide a Linux failure behind a Windows one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Chatty2.slnx

      # `dotnet format` is the naming gate, not the build: EnforceCodeStyleInBuild
      # does not surface IDE1006 naming violations as build errors in this SDK, so
      # a green build alone does not prove naming compliance. Style is
      # OS-independent, so running this on one leg is enough.
      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format Chatty2.slnx --verify-no-changes --severity warn

      - name: Build
        run: dotnet build Chatty2.slnx --no-restore

      # Includes Chatty2.Core.IntegrationTests, which opens real loopback TCP
      # sockets — the reason this runs on both operating systems.
      - name: Test
        run: dotnet test Chatty2.slnx --no-build
